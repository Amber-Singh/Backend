version: "3.9"

services:

  main-app:
    build: .
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app

  producer-app:
    build: .
    command: python -m uvicorn producer:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    env_file: .env
    volumes:
      - .:/app

  consumer:
    build: .
    command: python consumer.py
    env_file: .env
    volumes:
      - .:/app
